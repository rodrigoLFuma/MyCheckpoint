<div class="mx-auto mt-10 max-w-4xl">
  <a routerLink="/" class="text-sm text-blue-600 underline">&larr; Volver a inicio</a>

  <h1 class="mt-4 mb-4 text-xl font-bold">Gente con tus mismos gustos</h1>

  @if (isLoading()) {
    <p class="text-sm text-slate-500">Cargando...</p>
  }

  @if (errorMessage()) {
    <p class="text-sm text-red-600">{{ errorMessage() }}</p>
  }

  <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4">
    @for (user of users(); track user.id) {
      <a [routerLink]="['/users', user.id]" class="flex flex-col items-center gap-2 rounded border p-4 text-center hover:bg-slate-50">
        <app-user-avatar [imageUrl]="user.profilePictureURL" [name]="user.userName" sizeClass="h-16 w-16" />
        <span class="font-semibold">{{ user.userName }}</span>
      </a>
    }
  </div>

  @if (hasMore()) {
    <div class="mt-6 flex justify-center">
      <button
        type="button"
        (click)="loadMore()"
        [disabled]="isLoadingMore()"
        class="rounded border px-4 py-2 text-sm disabled:opacity-50"
      >
        {{ isLoadingMore() ? 'Cargando...' : 'Cargar más' }}
      </button>
    </div>
  }
</div>
