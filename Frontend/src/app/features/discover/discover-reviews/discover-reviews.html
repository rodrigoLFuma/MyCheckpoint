<div class="mx-auto max-w-2xl">
  <a routerLink="/" class="text-sm font-medium text-primary hover:underline">&larr; Volver a inicio</a>

  <h1 class="mt-4 mb-4 text-xl font-bold text-ink">Reseñas de otros sobre tus juegos</h1>

  @if (errorMessage()) {
    <p class="text-sm text-danger">{{ errorMessage() }}</p>
  }

  <div class="flex flex-col gap-3">
    @if (isLoading()) {
      @for (i of [1, 2, 3, 4]; track i) {
        <div class="flex gap-3 rounded-lg border border-border bg-surface p-3">
          <app-skeleton class="h-24 w-20 shrink-0" />
          <div class="min-w-0 flex-1">
            <app-skeleton class="h-3 w-24" />
            <app-skeleton class="mt-2 h-4 w-40" />
            <app-skeleton class="mt-3 h-3 w-full" />
            <app-skeleton class="mt-1 h-3 w-2/3" />
          </div>
        </div>
      }
    }
    @for (review of reviews(); track review.id) {
      <app-review-card
        [gameName]="review.game.name"
        [gameImageUrl]="review.game.coverImageUrl"
        [gameId]="review.game.id"
        [ownerId]="review.userSummary.id"
        [title]="review.title"
        [description]="review.review"
        [rate]="review.rate"
        [reviewId]="review.id"
        [likeCount]="review.likeCount"
        [likedByMe]="review.likedByMe"
      />
    }
  </div>

  @if (hasMore()) {
    <div class="mt-6 flex justify-center">
      <button
        type="button"
        (click)="loadMore()"
        [disabled]="isLoadingMore()"
        class="rounded-lg border border-border px-4 py-2 text-sm text-ink hover:bg-surface-hover disabled:opacity-50"
      >
        {{ isLoadingMore() ? 'Cargando...' : 'Cargar más' }}
      </button>
    </div>
  }
</div>
