<div class="mx-auto mt-10 max-w-4xl">
  <a routerLink="/social" class="text-sm text-blue-600 underline">&larr; Volver a Social</a>

  @if (errorMessage()) {
    <p class="mt-4 text-sm text-red-600">{{ errorMessage() }}</p>
  }

  @if (isLoading()) {
    <app-skeleton class="mt-4 mb-4 h-6 w-40" />
    <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4">
      @for (i of [1, 2, 3, 4, 5, 6, 7, 8]; track i) {
        <div class="flex flex-col items-center gap-2 rounded border p-4">
          <app-skeleton class="h-16 w-16 rounded-full" />
          <app-skeleton class="h-3 w-16" />
        </div>
      }
    </div>
  }

  @if (category(); as cat) {
    <h1 class="mt-4 mb-4 text-xl font-bold">Top {{ cat.name }}</h1>

    <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4">
      @for (user of users(); track user.id; let i = $index) {
        <a [routerLink]="['/users', user.id]" class="flex flex-col items-center gap-2 rounded border p-4 text-center hover:bg-slate-50">
          <span class="text-xs font-semibold text-slate-400">#{{ i + 1 }}</span>
          <app-user-avatar [imageUrl]="user.profilePictureURL" [name]="user.userName" sizeClass="h-16 w-16" />
          <span class="font-semibold">{{ user.userName }}</span>
        </a>
      }
    </div>

    @if (hasMore()) {
      <div class="mt-6 flex justify-center">
        <button
          type="button"
          (click)="loadMore()"
          [disabled]="isLoadingMore()"
          class="rounded border px-4 py-2 text-sm disabled:opacity-50"
        >
          {{ isLoadingMore() ? 'Cargando...' : 'Cargar más' }}
        </button>
      </div>
    }
  }
</div>
