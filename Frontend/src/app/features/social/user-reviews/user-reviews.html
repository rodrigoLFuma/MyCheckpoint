<div class="mx-auto mt-10 max-w-2xl">
  <a [routerLink]="['/users', userId]" class="text-sm text-blue-600 underline">&larr; Volver al perfil</a>

  @if (errorMessage()) {
    <p class="mt-4 text-sm text-red-600">{{ errorMessage() }}</p>
  }

  @if (isLoading()) {
    <app-skeleton class="mt-4 mb-4 h-6 w-48" />
    <div class="flex flex-col gap-3">
      @for (i of [1, 2, 3]; track i) {
        <div class="flex gap-3 rounded border p-3">
          <app-skeleton class="h-24 w-20 shrink-0" />
          <div class="min-w-0 flex-1">
            <app-skeleton class="h-3 w-24" />
            <app-skeleton class="mt-2 h-4 w-40" />
            <app-skeleton class="mt-3 h-3 w-full" />
          </div>
        </div>
      }
    </div>
  }

  @if (profileUser(); as user) {
    <h1 class="mt-4 mb-4 text-xl font-bold">Reseñas de {{ user.userName }}</h1>

    <div class="flex flex-col gap-3">
      @for (review of reviews(); track review.id) {
        <app-review-card
          [gameName]="review.game.name"
          [gameImageUrl]="review.game.coverImageUrl"
          [title]="review.title"
          [description]="review.review"
          [rate]="review.rate"
          [reviewId]="review.id"
          [likeCount]="review.likeCount"
          [likedByMe]="review.likedByMe"
        />
      }
    </div>
  }
</div>
