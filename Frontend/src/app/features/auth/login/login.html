<div class="mx-auto mt-16 max-w-sm rounded border p-6">
  <h1 class="mb-4 text-xl font-bold">Iniciar sesión</h1>

  <form (ngSubmit)="onSubmit()" class="flex flex-col gap-3">
    <input
      type="email"
      [(ngModel)]="email"
      name="email"
      placeholder="Email"
      required
      class="rounded border px-3 py-2"
    />
    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      placeholder="Contraseña"
      required
      class="rounded border px-3 py-2"
    />

    @if (errorMessage()) {
      <p class="text-sm text-red-600">{{ errorMessage() }}</p>
    }

    <button
      type="submit"
      [disabled]="isSubmitting()"
      class="rounded bg-blue-600 px-3 py-2 text-white disabled:opacity-50"
    >
      {{ isSubmitting() ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>

  <p class="mt-4 text-sm">
    ¿No tienes cuenta? <a routerLink="/register" class="text-blue-600 underline">Regístrate</a>
  </p>
</div>
