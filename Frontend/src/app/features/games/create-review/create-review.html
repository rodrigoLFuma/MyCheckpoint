@if (alreadyReviewed()) {
  <p class="mt-2 w-full rounded-lg bg-surface-hover px-2 py-1 text-center text-sm text-ink-muted">Reseña creada</p>
} @else if (!authService.isLoggedIn()) {
  <a routerLink="/login" class="mt-2 block text-sm font-medium text-primary hover:underline">Inicia sesión para reseñar</a>
} @else {
  <button
    type="button"
    (click)="startReview()"
    [disabled]="isImporting()"
    class="mt-2 w-full rounded-lg bg-primary px-2 py-1 text-sm font-semibold text-white hover:bg-primary-hover disabled:opacity-50"
  >
    {{ isImporting() ? 'Cargando...' : 'Crear reseña' }}
  </button>

  @if (errorMessage()) {
    <p class="mt-1 text-xs text-danger">{{ errorMessage() }}</p>
  }
}
