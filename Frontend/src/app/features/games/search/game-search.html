<div class="mx-auto mt-10 max-w-4xl">
  <h1 class="mb-4 text-xl font-bold">Buscar juegos</h1>

  <form (ngSubmit)="onSubmit()" class="mb-6 flex gap-2">
    <input
      type="text"
      [(ngModel)]="term"
      name="term"
      placeholder="Nombre del juego..."
      required
      class="flex-1 rounded border px-3 py-2"
    />
    <button
      type="submit"
      [disabled]="isSearching()"
      class="rounded bg-blue-600 px-4 py-2 text-white disabled:opacity-50"
    >
      {{ isSearching() ? 'Buscando...' : 'Buscar' }}
    </button>
  </form>

  @if (errorMessage()) {
    <p class="text-sm text-red-600">{{ errorMessage() }}</p>
  }

  @if (hasSearched() && !isSearching() && results().length === 0) {
    <p class="text-sm text-slate-500">No se han encontrado juegos con ese nombre.</p>
  }

  <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4">
    @for (result of results(); track result.id) {
      <app-game-card [name]="result.name ?? ''" [imageUrl]="result.background_image" [releaseDate]="result.released">
        <app-create-review
          [rawgId]="result.id!"
          [alreadyReviewed]="reviewedRawgIds().has(result.id!)"
          (created)="onReviewCreated(result.id!)"
        />
      </app-game-card>
    }
  </div>
</div>
