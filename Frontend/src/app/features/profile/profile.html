<div class="mx-auto mt-10 max-w-lg rounded border p-6">
  @if (authService.user(); as me) {
    <a [routerLink]="['/users', me.id]" class="text-sm text-blue-600 underline">&larr; Volver a mi perfil</a>
  }

  <h1 class="mt-4 mb-4 text-xl font-bold">Editar perfil</h1>

  <form (ngSubmit)="onSubmit()" class="flex flex-col gap-3">
    <label class="text-sm font-semibold">
      Nombre de usuario
      <input
        type="text"
        [(ngModel)]="userName"
        name="userName"
        required
        class="mt-1 w-full rounded border px-3 py-2"
      />
    </label>

    <label class="text-sm font-semibold">
      URL de foto de perfil
      <input
        type="url"
        [(ngModel)]="profilePictureURL"
        name="profilePictureURL"
        class="mt-1 w-full rounded border px-3 py-2"
      />
    </label>

    <label class="text-sm font-semibold">
      Biografía
      <textarea
        [(ngModel)]="bibliography"
        name="bibliography"
        rows="3"
        class="mt-1 w-full rounded border px-3 py-2"
      ></textarea>
    </label>

    <div class="text-sm font-semibold">
      Géneros favoritos
      <div class="mt-1 flex flex-wrap gap-2">
        @for (category of categories(); track category.id) {
          <label class="flex items-center gap-1 rounded border px-2 py-1 text-xs font-normal">
            <input
              type="checkbox"
              [checked]="selectedGenreIds().has(category.id)"
              (change)="toggleGenre(category.id)"
            />
            {{ category.name }}
          </label>
        }
      </div>
    </div>

    @if (saved()) {
      <p class="text-sm text-green-700">Perfil actualizado correctamente.</p>
    }

    @if (errorMessage()) {
      <p class="text-sm text-red-600">{{ errorMessage() }}</p>
    }

    <button
      type="submit"
      [disabled]="isSubmitting()"
      class="rounded bg-blue-600 px-3 py-2 text-white disabled:opacity-50"
    >
      {{ isSubmitting() ? 'Guardando...' : 'Guardar' }}
    </button>
  </form>
</div>
