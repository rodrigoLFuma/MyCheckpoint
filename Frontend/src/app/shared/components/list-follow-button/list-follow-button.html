@if (canFollow) {
  <button
    type="button"
    (click)="toggle()"
    [disabled]="isToggling()"
    class="shrink-0 rounded-full px-3 py-1.5 text-sm font-medium transition-colors disabled:opacity-50"
    [class]="displayedFollowed ? 'border border-border text-ink hover:bg-surface-hover' : 'bg-primary text-white hover:bg-primary-hover'"
  >
    {{ displayedFollowed ? 'Siguiendo' : 'Seguir' }}
  </button>
} @else {
  <span class="text-sm text-ink-muted">
    {{ displayedCount }} {{ displayedCount === 1 ? 'seguidor' : 'seguidores' }}
  </span>
}
