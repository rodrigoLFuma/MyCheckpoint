<div class="flex gap-3 rounded-lg border border-border bg-surface p-3 transition-colors hover:border-ink-faint">
  <!--
    Imagen y título llevan a la reseña completa (/reviews/:id); el "me
    gusta" y el "Ver más" de la descripción quedan fuera de este enlace
    para no anidar elementos interactivos dentro de él.
  -->
  <a [routerLink]="reviewId() != null ? ['/reviews', reviewId()] : null" class="shrink-0">
    @if (gameImageUrl()) {
      <img [src]="gameImageUrl()" [alt]="gameName()" class="h-24 w-20 rounded object-cover" />
    } @else {
      <div class="flex h-24 w-20 items-center justify-center rounded bg-surface-hover text-lg font-bold text-ink-faint">
        {{ gameName().charAt(0).toUpperCase() }}
      </div>
    }
  </a>

  <div class="min-w-0 flex-1">
    <div class="flex items-start justify-between gap-2">
      <a [routerLink]="reviewId() != null ? ['/reviews', reviewId()] : null" class="min-w-0">
        <p class="text-xs text-ink-muted">{{ gameName() }}</p>
        <h3 class="font-semibold text-ink hover:underline">{{ title() || gameName() }}</h3>
      </a>
      @if (rate() != null) {
        <span class="shrink-0 rounded bg-rating-soft px-2 py-1 text-xs font-semibold text-rating">
          {{ rate() }}/10
        </span>
      }
    </div>

    <div class="mt-1 text-sm text-ink-muted">
      <app-truncated-text [text]="description()" [reviewId]="reviewId()" />
    </div>

    @if (reviewId() != null) {
      <div class="mt-2">
        <app-like-button [reviewId]="reviewId()!" [likeCount]="likeCount()" [likedByMe]="likedByMe()" />
      </div>
    }
  </div>
</div>
