<div class="flex gap-3 rounded border p-3">
  @if (gameImageUrl()) {
    <img [src]="gameImageUrl()" [alt]="gameName()" class="h-24 w-20 shrink-0 rounded object-cover" />
  } @else {
    <div class="flex h-24 w-20 shrink-0 items-center justify-center rounded bg-slate-200 text-lg font-bold text-slate-500">
      {{ gameName().charAt(0).toUpperCase() }}
    </div>
  }

  <div class="min-w-0 flex-1">
    <div class="flex items-start justify-between gap-2">
      <div>
        <p class="text-xs text-slate-500">{{ gameName() }}</p>
        <h3 class="font-semibold">{{ title() || gameName() }}</h3>
      </div>
      @if (rate() != null) {
        <span class="shrink-0 rounded bg-blue-100 px-2 py-1 text-xs font-semibold text-blue-700">
          {{ rate() }}/10
        </span>
      }
    </div>

    <div class="mt-1 text-sm text-slate-600">
      <app-truncated-text [text]="description()" [reviewId]="reviewId()" />
    </div>

    @if (reviewId() != null) {
      <div class="mt-2">
        <app-like-button [reviewId]="reviewId()!" [likeCount]="likeCount()" [likedByMe]="likedByMe()" />
      </div>
    }
  </div>
</div>
