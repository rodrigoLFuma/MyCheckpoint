<button
  type="button"
  (click)="toggle()"
  [disabled]="isDisabled()"
  class="flex min-w-40 items-center justify-between gap-2 rounded-lg border border-border bg-bg-raised px-3 py-2 text-left text-sm text-ink transition-colors hover:border-ink-faint focus:border-primary focus:outline-none disabled:opacity-50"
>
  <span class="truncate">{{ selectedLabel }}</span>
  <span class="shrink-0 text-xs text-ink-faint">▾</span>
</button>

@if (isOpen()) {
  <ul
    class="absolute z-20 mt-1 max-h-64 w-full min-w-max overflow-auto rounded-lg border border-border bg-surface py-1 shadow-xl"
  >
    @for (option of options(); track option.value) {
      <li>
        <button
          type="button"
          (click)="selectOption(option)"
          class="block w-full px-3 py-2 text-left text-sm whitespace-nowrap hover:bg-surface-hover"
          [class]="option.value === value() ? 'font-medium text-primary' : 'text-ink'"
        >
          {{ option.label }}
        </button>
      </li>
    }
  </ul>
}
