@if (imageUrl()) {
  <img [src]="imageUrl()" [alt]="name()" [class]="sizeClass() + ' rounded-full object-cover'" />
} @else {
  <div [class]="sizeClass() + ' flex items-center justify-center rounded-full bg-slate-300 text-slate-500'">
    <svg viewBox="0 0 24 24" fill="currentColor" class="h-2/3 w-2/3">
      <path
        d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"
      />
    </svg>
  </div>
}
