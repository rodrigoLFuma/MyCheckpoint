<header class="relative flex items-center justify-between bg-slate-800 px-6 py-4 text-white">
  <a routerLink="/" class="font-bold">MyCheckpoint</a>

  @if (authService.isLoggedIn()) {
    <div class="relative">
      <button
        type="button"
        (click)="toggleMenu()"
        class="flex items-center gap-1 rounded px-2 py-1 hover:bg-slate-700"
      >
        {{ authService.user()?.userName }}
        <span class="text-xs">▾</span>
      </button>

      @if (isMenuOpen()) {
        <div class="fixed inset-0 z-10" (click)="closeMenu()"></div>

        <div class="absolute right-0 z-20 mt-2 w-40 rounded border border-slate-600 bg-slate-800 shadow-lg">
          <a
            routerLink="/profile"
            (click)="closeMenu()"
            class="block w-full px-4 py-2 hover:bg-slate-700"
          >
            Mi perfil
          </a>
          <button
            type="button"
            (click)="logout()"
            class="w-full rounded px-4 py-2 text-left text-red-500 hover:bg-slate-700"
          >
            Cerrar sesión
          </button>
        </div>
      }
    </div>
  } @else {
    <a routerLink="/login" class="underline">Iniciar sesión</a>
  }
</header>

<main class="p-6">
  <router-outlet />
</main>
