<header class="flex items-center justify-between bg-slate-800 px-6 py-4 text-white">
  <a routerLink="/" class="font-bold">MyCheckpoint</a>

  @if (authService.isLoggedIn()) {
    <span>{{ authService.user()?.userName }}</span>
  } @else {
    <a routerLink="/login" class="underline">Iniciar sesión</a>
  }
</header>

<main class="p-6">
  <router-outlet />
</main>
